[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "pyastron"
dynamic = ["version"]
description = "Python bindings for an embedded Astron server"
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.10",
    "Operating System :: Microsoft :: Windows :: Windows 10",
]

[project.urls]
Repository = "https://github.com/LoopyAshy/Pyastron"
Issues = "https://github.com/LoopyAshy/Pyastron/issues"

[tool.maturin]
bindings = "pyo3"
strip = true
